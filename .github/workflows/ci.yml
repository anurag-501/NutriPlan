name: CI

on:
  push:
    branches: [main, refactor-and-ui-update, dev]
  pull_request:
    branches: [main]

jobs:
  secret-scan:
    name: Scan repository history for secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Scan with Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r FastAPI_Backend/requirements.txt -r FastAPI_Backend/requirements-dev.txt

      - name: Lint with ruff
        working-directory: FastAPI_Backend
        run: ruff check .

      - name: Run tests with coverage
        run: pytest FastAPI_Backend/tests/ -v --cov=FastAPI_Backend --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: react_frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: react_frontend
        run: npm ci

      - name: Test frontend
        working-directory: react_frontend
        run: npm test

      - name: Lint frontend
        working-directory: react_frontend
        run: npm run lint

      - name: Type-check frontend
        working-directory: react_frontend
        run: npx tsc --noEmit

      - name: Validate production smoke-test command
        run: python scripts/production_smoke.py --help

      - name: Build frontend
        working-directory: react_frontend
        run: npm run build
