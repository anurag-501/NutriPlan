services:
  backend:
    build:
      context: .
      dockerfile: FastAPI_Backend/Dockerfile
    image: nutriplan-backend:local
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      PORT: "8080"
      AI_PROVIDER: ${AI_PROVIDER:-ollama}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:4b-instruct-2507-q4_K_M}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-600}
      OLLAMA_THINK: ${OLLAMA_THINK:-false}
      OLLAMA_MAX_OUTPUT_TOKENS: ${OLLAMA_MAX_OUTPUT_TOKENS:-512}
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-8192}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-6-luna}
      OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-35}
      OPENAI_MAX_RETRIES: ${OPENAI_MAX_RETRIES:-1}
      OPENAI_MAX_OUTPUT_TOKENS: ${OPENAI_MAX_OUTPUT_TOKENS:-1400}
      CHAT_RATE_LIMIT_PER_MINUTE: ${CHAT_RATE_LIMIT_PER_MINUTE:-12}
      API_ADMIN_TOKEN: ${API_ADMIN_TOKEN:-}
      API_PLATFORM_RATE_LIMIT_PER_MINUTE: ${API_PLATFORM_RATE_LIMIT_PER_MINUTE:-30}
      NUTRIPLAN_DB_PATH: /app/backend/data/api_platform.sqlite3
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    networks:
      - project_network
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  frontend:
    build:
      context: ./react_frontend
      dockerfile: Dockerfile
    image: nutriplan-frontend:local
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      - project_network
    depends_on:
      backend:
        condition: service_healthy

networks:
  project_network:
